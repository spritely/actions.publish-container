name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@4cfdbeda793c36c34d292437fbc890db2c26fdd2 # v0.7.34

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@4cfdbeda793c36c34d292437fbc890db2c26fdd2 # v0.7.34
        with:
          version: ${{ steps.version.outputs.version }}

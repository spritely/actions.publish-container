name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@8598c26d0f01e0de4e6965c45433becfa6bace68 # v0.8.84

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@8598c26d0f01e0de4e6965c45433becfa6bace68 # v0.8.84
        with:
          version: ${{ steps.version.outputs.version }}

name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@62935a52487335c488b0a98a1193adea99f3c1a7 # v0.8.63

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@62935a52487335c488b0a98a1193adea99f3c1a7 # v0.8.63
        with:
          version: ${{ steps.version.outputs.version }}

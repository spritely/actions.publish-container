name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@19fbc98f03e548b9dd8f7691be1497d1d2624197 # v0.8.17

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@19fbc98f03e548b9dd8f7691be1497d1d2624197 # v0.8.17
        with:
          version: ${{ steps.version.outputs.version }}

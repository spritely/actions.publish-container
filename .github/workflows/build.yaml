name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@13f379c91bf9ba876be919ef2debb8dda5704135 # v0.8.81

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@13f379c91bf9ba876be919ef2debb8dda5704135 # v0.8.81
        with:
          version: ${{ steps.version.outputs.version }}

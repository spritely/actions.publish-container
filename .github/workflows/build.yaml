name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@536e7f6d7d2b24d537fc1e8711bf6ff45468f45c # v0.7.52

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@536e7f6d7d2b24d537fc1e8711bf6ff45468f45c # v0.7.52
        with:
          version: ${{ steps.version.outputs.version }}

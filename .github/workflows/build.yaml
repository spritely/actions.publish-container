name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@5e5d1b92d45707b2f52e84d35d9eb3664e3d3845 # v0.8.2

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@5e5d1b92d45707b2f52e84d35d9eb3664e3d3845 # v0.8.2
        with:
          version: ${{ steps.version.outputs.version }}

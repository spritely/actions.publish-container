name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@1f2e124d7010c26bf864972f9efc2c222d524ccf # v0.8.21

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@1f2e124d7010c26bf864972f9efc2c222d524ccf # v0.8.21
        with:
          version: ${{ steps.version.outputs.version }}

name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@fd401a5c54587c1c3d042eaafd6537e1bcfba69e # v0.7.56

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@fd401a5c54587c1c3d042eaafd6537e1bcfba69e # v0.7.56
        with:
          version: ${{ steps.version.outputs.version }}

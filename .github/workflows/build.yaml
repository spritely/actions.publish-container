name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@818bffb8cdeab7bdc2cacf4a29568ba003faa771 # v0.8.14

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@818bffb8cdeab7bdc2cacf4a29568ba003faa771 # v0.8.14
        with:
          version: ${{ steps.version.outputs.version }}

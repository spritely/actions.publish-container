name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@ee1437cd42e23b24ac69b9b136c8addf29cdc72a # v0.8.79

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@ee1437cd42e23b24ac69b9b136c8addf29cdc72a # v0.8.79
        with:
          version: ${{ steps.version.outputs.version }}

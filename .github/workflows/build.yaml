name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@8b8a339a7f6dfc7ce8b4e9e229552ec1ff4c4972 # v0.8.4

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@8b8a339a7f6dfc7ce8b4e9e229552ec1ff4c4972 # v0.8.4
        with:
          version: ${{ steps.version.outputs.version }}

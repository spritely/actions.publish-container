name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@1599b65452dbd3bab9771036b3da26d06b9a39ce # v0.7.36

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@1599b65452dbd3bab9771036b3da26d06b9a39ce # v0.7.36
        with:
          version: ${{ steps.version.outputs.version }}

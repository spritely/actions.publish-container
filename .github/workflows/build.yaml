name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@ee17f0fc7cffd5d6fdbbf00072de91e847dd5b09 # v0.8.27

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@ee17f0fc7cffd5d6fdbbf00072de91e847dd5b09 # v0.8.27
        with:
          version: ${{ steps.version.outputs.version }}

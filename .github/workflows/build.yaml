name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@d261ab50c233ed8eeadb63cfa757560c849cb297 # v0.8.7

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@d261ab50c233ed8eeadb63cfa757560c849cb297 # v0.8.7
        with:
          version: ${{ steps.version.outputs.version }}

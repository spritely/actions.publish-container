name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@bfbdb18ce4a62a95199fa2d0da2785927934e24d # v0.8.73

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@bfbdb18ce4a62a95199fa2d0da2785927934e24d # v0.8.73
        with:
          version: ${{ steps.version.outputs.version }}

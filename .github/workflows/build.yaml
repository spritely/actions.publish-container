name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@9d523b96a0c2cbfc354bec7d45476ab001a9aeeb # v0.7.51

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@9d523b96a0c2cbfc354bec7d45476ab001a9aeeb # v0.7.51
        with:
          version: ${{ steps.version.outputs.version }}

name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@57e8c8d525adb63c4a7c94af33ce9ffbcb7d290f # v0.7.35

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@57e8c8d525adb63c4a7c94af33ce9ffbcb7d290f # v0.7.35
        with:
          version: ${{ steps.version.outputs.version }}

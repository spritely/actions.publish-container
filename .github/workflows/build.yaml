name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@c2facbd70ad752ccd78745afc8b28586b4479d1e # v0.8.19

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@c2facbd70ad752ccd78745afc8b28586b4479d1e # v0.8.19
        with:
          version: ${{ steps.version.outputs.version }}

name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@23e3fbd09377d23ac01cbdbb37adb5040d86bf63 # v0.8.0

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@23e3fbd09377d23ac01cbdbb37adb5040d86bf63 # v0.8.0
        with:
          version: ${{ steps.version.outputs.version }}

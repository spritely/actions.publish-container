name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@7ded06be5624a3128c12da123690b462ab442a0c # v0.7.43

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@7ded06be5624a3128c12da123690b462ab442a0c # v0.7.43
        with:
          version: ${{ steps.version.outputs.version }}

name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@fc33bfcacfa8e78e42c9e9a77c1073ce860fc60b # v0.8.48

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@fc33bfcacfa8e78e42c9e9a77c1073ce860fc60b # v0.8.48
        with:
          version: ${{ steps.version.outputs.version }}

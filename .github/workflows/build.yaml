name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-26.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@fc65cf49e7ae1327aaf7a1e12a5aea5158f3a1bf # v0.8.54

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@fc65cf49e7ae1327aaf7a1e12a5aea5158f3a1bf # v0.8.54
        with:
          version: ${{ steps.version.outputs.version }}

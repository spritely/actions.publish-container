name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@5da25e978a440b6d8e9770aa152c7884dd388aaa # v0.8.23

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@5da25e978a440b6d8e9770aa152c7884dd388aaa # v0.8.23
        with:
          version: ${{ steps.version.outputs.version }}

name: Build

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@5f977ce4042b900c13ec177044a88b1ed5c6ceb7 # v0.8.12

      - name: Run tests
        uses: ./tests

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@5f977ce4042b900c13ec177044a88b1ed5c6ceb7 # v0.8.12
        with:
          version: ${{ steps.version.outputs.version }}
